services:
  # ASP.NET Core Web Service
  - type: web
    name: autostockiq
    runtime: docker
    plan: free
    dockerContext: ./AutoStockIQ
    dockerfilePath: ./AutoStockIQ/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:80
