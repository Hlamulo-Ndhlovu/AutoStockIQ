services:
  - type: web
    name: autostockiq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Optional: attach a Render Disk at /var/data and uncomment to keep SQLite across deploys
      # - key: DATA_DIRECTORY
      #   value: /var/data
